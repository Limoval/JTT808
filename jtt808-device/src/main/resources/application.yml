server:
  port: 8081

spring:
  application:
    name: jtt808-device
  profiles:
    active: dev

  # 数据库配置
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/jtt808?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      username: root
      password: ${MYSQL_PASSWORD:password}
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.bmp,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        enabled: ${DRUID_STAT_VIEW_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_STAT_USERNAME:admin}
        login-password: ${DRUID_STAT_PASSWORD:}

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.lk.jtt808.common.entity

# JTT808协议配置
jtt808:
  internal-api:
    auth:
      enabled: ${JTT808_INTERNAL_AUTH_ENABLED:true}
      header-name: ${JTT808_INTERNAL_AUTH_HEADER:X-Internal-Token}
      token: ${JTT808_INTERNAL_TOKEN:dev-internal-token}
  # 请求超时时间（秒）
  request-timeout: 30
  # 最大分包数量
  max-package-count: 255
  # 消息最大长度
  max-message-length: 1024
  # 心跳间隔（秒）
  heartbeat-interval: 60
  # 鉴权码有效期（秒）
  auth-code-expire: 300
  # 重连间隔（秒）
  reconnect-interval: 10
  # 最大重连次数
  max-reconnect-times: 5

  # 注册超时（秒）
  registration:
    timeout-seconds: 30

  # 传输层配置
  transport:
    tcp:
      enabled: true
      port: 8082
      reader-idle-seconds: 180
      read-timeout-seconds: 300
    udp:
      enabled: false
      port: 8083
      session-timeout-seconds: 300

# 日志配置
logging:
  level:
    com.lk.jtt808: DEBUG
    org.springframework: INFO
    com.alibaba.druid: INFO
    org.mybatis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/jtt808-device.log
    max-size: 100MB
    max-history: 30

# 监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    druid:
      url: jdbc:mysql://localhost:3306/jtt808?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
  data:
    redis:
      host: localhost

---
# 测试环境配置
spring:
  config:
    activate:
      on-profile: test
  datasource:
    druid:
      url: jdbc:mysql://test-mysql:3306/jtt808?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
  data:
    redis:
      host: test-redis

---
# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    druid:
      url: jdbc:mysql://prod-mysql:3306/jtt808?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
  data:
    redis:
      host: prod-redis
      password: ${REDIS_PASSWORD}
# 生产环境日志级别调整
logging:
  level:
    com.lk.jtt808: INFO
